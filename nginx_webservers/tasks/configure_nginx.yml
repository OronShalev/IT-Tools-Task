---
- name: Ensure SSL directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/ssl/private, mode: '0700' }
    - { path: /etc/ssl/certs, mode: '0755' }
  become: true

- name: Install crypto prerequisites
  ansible.builtin.yum:
    name:
      - python3-cryptography
      - python3-pyOpenSSL
    state: present
  become: true

- name: Generate private key for web site
  community.crypto.openssl_privatekey:
    path: /etc/ssl/private/{{ inventory_hostname }}.key
    size: 4096
    type: RSA
    mode: '0600'
  become: true

- name: Create CSR for web site
  community.crypto.openssl_csr_pipe:
    privatekey_path: /etc/ssl/private/{{ inventory_hostname }}.key
    subject_alt_name:
      - "DNS:{{ inventory_hostname }}.com"
      - "DNS:{{ inventory_hostname }}"
      - "IP:{{ ansible_host }}"
  register: csr
  become: true

- name: Sign the CSR with the CA
  community.crypto.x509_certificate_pipe:
    csr_content: "{{ csr.csr }}"
    provider: ownca
    ownca_path: /etc/ssl/certs/ca.crt
    ownca_privatekey_path: /etc/ssl/private/ca.key
    ownca_not_before: "-1d"
    ownca_not_after: "+365d"
  delegate_to: "{{ groups['ca_server'][0] }}"
  register: signed_certificate
  become: true

- name: Write signed certificate to web server
  ansible.builtin.copy:
    dest: /etc/ssl/certs/{{ inventory_hostname }}.crt
    content: "{{ signed_certificate.certificate }}"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Nginx configuration file
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  become: true

- name: Start and enable Nginx service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true

- name: Allow HTTP and HTTPS traffic through the firewall
  ansible.builtin.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
  become: true
  notify:
    - Reload firewalld
