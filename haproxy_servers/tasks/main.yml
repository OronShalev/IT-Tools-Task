---
# tasks file for haproxy_servers
- name: Install Haproxy
  ansible.builtin.package:
    name: haproxy
    state: present
  become: true
  
- name: Copy Haproxy configuration file
  ansible.builtin.template:
    src: haproxy.conf.j2
    dest: /etc/haproxy/haproxy.cfg
  become: true
  notify:
    - Reload Haproxy

- name: Ensure haproxy chroot directory exists
  ansible.builtin.file:
    path: /var/lib/haproxy
    state: directory
    owner: haproxy
    group: haproxy
    mode: '0755'
  become: true

- name: Remove stale HAProxy stats socket
  ansible.builtin.file:
    path: /var/lib/haproxy/stats
    state: absent
  become: true

- name: Ensure /run/haproxy directory exists for stats socket
  ansible.builtin.file:
    path: /run/haproxy
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Start and enable Haproxy service
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
  become: true

- name: Allow HTTP and HTTPS traffic through the firewall
  ansible.builtin.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
  become: true
  notify:
    - Reload firewalld